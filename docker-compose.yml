services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      WEBHOOK_BODY_LIMIT_BYTES: ${WEBHOOK_BODY_LIMIT_BYTES:-262144}
      TTN_WEBHOOK_ENABLED: ${TTN_WEBHOOK_ENABLED:-false}
      TTN_WEBHOOK_SECRET: ${TTN_WEBHOOK_SECRET:-}
      PUBLIC_RATE_LIMIT_REQUESTS: ${PUBLIC_RATE_LIMIT_REQUESTS:-120}
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:-60}
      INGESTION_RATE_LIMIT_REQUESTS: ${INGESTION_RATE_LIMIT_REQUESTS:-30}
      INGESTION_RATE_LIMIT_WINDOW_SECONDS: ${INGESTION_RATE_LIMIT_WINDOW_SECONDS:-60}
      DEVICE_STALE_AFTER_MINUTES: ${DEVICE_STALE_AFTER_MINUTES:-90}
      DEVICE_OFFLINE_AFTER_MINUTES: ${DEVICE_OFFLINE_AFTER_MINUTES:-180}
      MAX_MEASUREMENT_RANGE_DAYS: ${MAX_MEASUREMENT_RANGE_DAYS:-31}
      DEFAULT_MEASUREMENT_RANGE_DAYS: ${DEFAULT_MEASUREMENT_RANGE_DAYS:-7}
      MAX_MEASUREMENT_RESULT_ROWS: ${MAX_MEASUREMENT_RESULT_ROWS:-5000}
      CHART_MEASUREMENT_TARGET_POINTS: ${CHART_MEASUREMENT_TARGET_POINTS:-2000}
      DATA_DICTIONARY_PATH: /workspace-docs/data-dictionary.md
    volumes:
      - ./backend:/app
      - ./docs:/workspace-docs:ro
      - backend-venv:/app/.venv
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ttn-mqtt-worker:
    profiles: ['live']
    build:
      context: ./backend
      target: development
    command: ['uv', 'run', 'python', '-m', 'app.scripts.run_ttn_mqtt_worker']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TTN_MQTT_HOST: ${TTN_MQTT_HOST:-eu1.cloud.thethings.network}
      TTN_MQTT_PORT: ${TTN_MQTT_PORT:-8883}
      TTN_MQTT_USERNAME: ${TTN_MQTT_USERNAME:-rain-garden@ttn}
      TTN_MQTT_TOPIC: ${TTN_MQTT_TOPIC:-v3/rain-garden@ttn/devices/+/up}
      TTN_MQTT_API_KEY: ${TTN_MQTT_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  backend-venv:
  frontend-node-modules:
