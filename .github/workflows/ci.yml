name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rain_garden_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rain_garden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rain_garden_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://rain_garden_test:test-only-password@localhost:5432/rain_garden_test
      APP_ENV: test
      DEMO_MODE: 'true'
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TTN_WEBHOOK_ENABLED: 'false'
      TTN_WEBHOOK_SECRET: test-only-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy .
        working-directory: backend
      - run: uv run alembic upgrade 0001
        working-directory: backend
      - run: uv run python ../scripts/phase1_upgrade_fixture.py prepare
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run python ../scripts/phase1_upgrade_fixture.py verify
        working-directory: backend
      - run: uv run python ../scripts/phase1_upgrade_fixture.py cleanup
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - run: uv run python -m app.db.seed
        working-directory: backend
      - run: uv run pytest --cov=app --cov-branch --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_portability.py

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run python ../scripts/export_openapi.py
        working-directory: backend
      - run: npm run check:api
        working-directory: frontend
      - run: python3 scripts/check_public_privacy.py

  end-to-end:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_USER: rain_garden_admin
      POSTGRES_ADMIN_PASSWORD: ci-admin-password
      APP_DB_NAME: rain_garden
      APP_DB_USER: rain_garden_app
      APP_DB_PASSWORD: ci-app-password
      DATABASE_URL: postgresql+psycopg://rain_garden_app:ci-app-password@db:5432/rain_garden
      APP_ENV: test
      DEMO_MODE: 'true'
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      WEBHOOK_BODY_LIMIT_BYTES: 262144
      TTN_WEBHOOK_ENABLED: 'false'
      TTN_WEBHOOK_SECRET: ci-webhook-secret
      PUBLIC_RATE_LIMIT_REQUESTS: 120
      PUBLIC_RATE_LIMIT_WINDOW_SECONDS: 60
      INGESTION_RATE_LIMIT_REQUESTS: 30
      INGESTION_RATE_LIMIT_WINDOW_SECONDS: 60
      DEVICE_STALE_AFTER_MINUTES: 90
      DEVICE_OFFLINE_AFTER_MINUTES: 180
      MAX_MEASUREMENT_RANGE_DAYS: 31
      DEFAULT_MEASUREMENT_RANGE_DAYS: 7
      MAX_MEASUREMENT_RESULT_ROWS: 5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm backend uv run alembic upgrade head
      - run: docker compose run --rm backend uv run python -m app.db.seed
      - run: docker compose run --rm backend uv run python -m app.db.seed_ttn_proxy
      - run: docker compose up -d backend frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
